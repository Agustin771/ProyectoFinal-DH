# MySQL
spring.datasource.url=${URL_BD}
spring.datasource.username=${USERNAME_BD}
spring.datasource.password=${PASSWORD_BD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT - clave inventada larga
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration-ms=604800000

#LOGGER
logging.file.name=logs/mi-aplicacion.log
logging.level.root=INFO
logging.level.com.agustinperez.proyectoSecurity=DEBUG

# ROTACION AUTOMATICA DE LOGS
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB
logging.logback.rollingpolicy.clean-history-on-start=true

# Configuración del servidor de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cookie.secure=false

# Usuario administrador de demostración
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

server.port=8080
